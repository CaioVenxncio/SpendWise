name: spendwise
version: 1.0.0+1
description: A privacy-first personal expense tracker.
publish_to: 'none'

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7
  cupertino_icons: ^2.0.0
  drift: 2.35.2
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  sqlite3: 3.5.2
  uuid: ^4.6.0
  web: ^1.1.1

dev_dependencies:
  build_runner: 2.16.2
  drift_dev: 2.35.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
